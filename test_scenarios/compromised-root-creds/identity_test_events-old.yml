    event:
      p_log_type: Okta.SystemLog
      eventType: user.session.start
      outcome:
        result: SUCCESS
      actor:
        alternateId: contractor.jsmith@corp.beazley.com
        displayName: James Smith (Contractor)
        id: okta-user-contractor-001
        type: User
      client:
        ipAddress: 185.220.101.47
        device: Computer
        geographicalContext:
