    p_log_type: SentinelOne.DeepVisibilityV2
    account.id: xyzcompany-s1-account-01
    event.time: 0
    event.type: ProcessCreation
    event.category: process
    src.process.name: powershell.exe
    src.process.cmdline: powershell.exe -NoProfile -NonInteractive -WindowStyle Hidden -enc RwBlAHQALQBDAGgAaQBsAGQASQB0AGUAbQAgAC0AUABhAHQAaAAgAEMAOgBcAFUAcwBlAHIAcwBcAGoAcwBtAGkAdABoAFwARABvAGMAdQBtAGUAbgB0AHMAIAAtAFIAZQBjAHUAcgBzAGUA
    src.process.image.path: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    src.process.image.sha256: c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4
    src.process.user: BEAZLEY\contractor.jsmith
    src.process.pid: 8844
    src.process.parent.name: rclone.exe
    src.process.parent.image.path: C:\Users\jsmith\Downloads\rclone.exe
    src.process.parent.pid: 9901
    src.process.storyline.id: INSIDER-2026
    tgt.process.name: ''
    endpoint.name: WKSTN-CONTRACT-01
    endpoint.os: windows
    agent.uuid: s1-agent-xyzcompany-contract-01
    site.name: corp.xyzcompany.com
