AnalysisType: rule
RuleID: "Insider.EntraID.OffHours.AnomalousLogin"
DisplayName: "Entra ID - Off-Hours Login New Device No MFA"
Filename: entra_offhours_anomalous_login.py
Enabled: true
Severity: High
LogTypes:
  - Azure.Audit
Tags:
  - insider-threat
  - compromised-contractor
  - identity
  - ATT&CK:T1078.004
  - ATT&CK:T1556.006
  - Detection.POC
Reports:
  MITRE ATT&CK:
    - TA0001:T1078.004
    - TA0005:T1556.006
Description: >
  Detects sign-in activity outside business hours (10pm-6am UTC) from an
  unregistered device or with MFA not satisfied. Indicative of compromised
  contractor credentials or malicious insider activity. High-value signal
  when correlated with subsequent EDR or AWS activity sharing the same UPN.
DedupPeriodMinutes: 60
Threshold: 1
Runbook: >
  1. Identify the UPN from properties.userPrincipalName.
  2. Check properties.ipAddress against known corporate IP ranges.
  3. Check properties.location.countryOrRegion — unexpected country is high risk.
  4. Check properties.deviceDetail.deviceId — empty = unregistered device.
  5. Review all activity by this UPN in the last 24h across all sources.
  6. If contractor account — suspend immediately and notify account owner.
  7. Correlate with EDR and AWS sources for the same UPN/IP.
Tests:
  - Name: Off-hours login no MFA unregistered device
    ExpectedResult: true
    Log:
      {
        "category": "SignInLogs",
        "operationName": "Sign-in activity",
        "Level": "Informational",
        "callerIpAddress": "185.220.101.47",
        "correlationId": "signin-corr-001",
        "properties": {
          "createdDateTime": "2026-05-22T02:15:00Z",
          "userPrincipalName": "contractor.jsmith@corp.xyzcompany.com",
          "userDisplayName": "James Smith (Contractor)",
          "ipAddress": "185.220.101.47",
          "status": {"errorCode": 0, "failureReason": null},
          "conditionalAccessStatus": "notApplied",
          "authenticationDetails": [
            {"authenticationMethod": "Password", "succeeded": true}
          ],
          "deviceDetail": {
            "deviceId": "",
            "displayName": "",
            "operatingSystem": "Windows 10",
            "browser": "Chrome 120.0"
          },
          "location": {
            "city": "Bucharest",
            "countryOrRegion": "RO",
            "geoCoordinates": {"latitude": 44.43, "longitude": 26.1}
          },
          "riskDetail": "none",
          "riskLevelAggregated": "none",
          "clientAppUsed": "Browser"
        }
      }
  - Name: Business hours login with MFA - should not fire
    ExpectedResult: false
    Log:
      {
        "category": "SignInLogs",
        "operationName": "Sign-in activity",
        "Level": "Informational",
        "callerIpAddress": "10.0.1.50",
        "correlationId": "signin-corr-002",
        "properties": {
          "createdDateTime": "2026-05-22T14:30:00Z",
          "userPrincipalName": "jsmith@corp.xyzcompany.com",
          "ipAddress": "10.0.1.50",
          "status": {"errorCode": 0},
          "conditionalAccessStatus": "success",
          "authenticationDetails": [
            {"authenticationMethod": "Password", "succeeded": true},
            {"authenticationMethod": "Microsoft Authenticator", "succeeded": true}
          ],
          "deviceDetail": {
            "deviceId": "device-aad-registered-001",
            "displayName": "CORP-LAPTOP-01",
            "operatingSystem": "Windows 11"
          },
          "location": {
            "city": "Dallas",
            "countryOrRegion": "US"
          },
          "riskDetail": "none",
          "riskLevelAggregated": "none"
        }
      }
