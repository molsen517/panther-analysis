# ─────────────────────────────────────────────────────────────────────────────
# EDR UDM Test Events v2 — corrected schemas for all 4 vendors
#
# Schema structures per vendor:
#   CrowdStrike.EventStreams  → metadata: {} + event: {}  (nested)
#   MicrosoftDefenderXDR     → time/tenantId/category + properties: {} (nested)
#   CarbonBlack.EndpointEvent → flat, requires action + device_timestamp
#   SentinelOne.DeepVisibilityV2 → flat, requires event.time + account.id
#
# ⚠️  NOTE: CrowdStrike HTTP source is EventStreams format.
#     Your UDM detections list Crowdstrike.FDREvent — add Crowdstrike.EventStreams
#     to LogTypes in those detections for CrowdStrike alerts to fire.
# ─────────────────────────────────────────────────────────────────────────────

events:

  # ══════════════════════════════════════════════════════
