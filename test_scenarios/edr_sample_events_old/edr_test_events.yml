# ─────────────────────────────────────────────────────────────────────────────
# EDR UDM Test Events
# Used with send_edr_events.py to trigger (or not) Panther detections
#
# Fields per event:
#   id               - unique identifier
#   description      - human-readable label shown in script output
#   malicious        - true = should trigger a detection, false = benign baseline
#   expected_detection - RuleID of the detection that should fire (malicious only)
#   event            - raw log payload sent to Panther HTTP source
#               NOTE: p_log_type tells the script which HTTP source to route to
# ─────────────────────────────────────────────────────────────────────────────

events:

  # ══════════════════════════════════════════════════════
  # EDR.UDM.Base64.Encoded.Cmdline
  # ══════════════════════════════════════════════════════

  - id: b64_cs_enc_flag
    description: "CrowdStrike — PowerShell -EncodedCommand (should fire)"
    malicious: true
    expected_detection: EDR.UDM.Base64.Encoded.Cmdline
    event:
      p_log_type: Crowdstrike.FDREvent
      event_simpleName: ProcessRollup2
      FileName: powershell.exe
      ImageFileName: \Device\HarddiskVolume2\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
      CommandLine: "powershell.exe -EncodedCommand SGVsbG8gV29ybGQ="
      UserName: BEAZLEY\jsmith
      ComputerName: BWKSTN-042
      SHA256HashData: a3f1b2c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2

  - id: b64_cs_enc_short
    description: "CrowdStrike — PowerShell -enc shorthand (should fire)"
    malicious: true
    expected_detection: EDR.UDM.Base64.Encoded.Cmdline
    event:
      p_log_type: Crowdstrike.FDREvent
      event_simpleName: ProcessRollup2
      FileName: powershell.exe
      CommandLine: "powershell -enc aQBmACgAMQAgAC0AZQBxACAAMQApAHsAZQB4AGkAdAB9AA=="
      UserName: BEAZLEY\analyst1
      ComputerName: BWKSTN-017

  - id: b64_s1_enc
    description: "SentinelOne — PowerShell -encodedcommand (should fire)"
    malicious: true
    expected_detection: EDR.UDM.Base64.Encoded.Cmdline
    event:
      p_log_type: SentinelOne.DeepVisibilityV2
      "src.process.name": powershell.exe
      "src.process.image.path": C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
      "src.process.cmdline": "powershell.exe -encodedcommand UwB0AGEAcgB0AC0AUwBsAGUAZQBwACAALQBzACAAMQAwAA=="
      "src.process.user": BEAZLEY\jsmith
      "endpoint.name": BWKSTN-088
      "src.process.image.sha256": b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3

  - id: b64_cb_frombase64
    description: "CarbonBlack — FromBase64String pattern (should fire)"
    malicious: true
    expected_detection: EDR.UDM.Base64.Encoded.Cmdline
    event:
      p_log_type: CarbonBlack.EndpointEvent
      type: endpoint.event.procstart
      process_name: powershell.exe
      process_cmdline: "powershell.exe -c [System.Convert]::FromBase64String('aQBmACgAMQApAHsAZQB4AGkAdAB9AA==')"
      process_username: BEAZLEY\itadmin
      device_name: BSRV-DC01

  - id: b64_def_encoded
    description: "Defender XDR — cmd /c with base64 wscript (should fire)"
    malicious: true
    expected_detection: EDR.UDM.Base64.Encoded.Cmdline
    event:
      p_log_type: MicrosoftDefenderXDR.AdvancedHunting
      ActionType: ProcessCreated
      FileName: wscript.exe
      ProcessCommandLine: "wscript.exe //b //nologo /e:vbscript /EncodedCommand cABvAHcAZQByAHMAaABlAGwAbAA="
      AccountName: jsmith
      DeviceName: BWKSTN-099
      SHA256: c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4

  - id: b64_cs_benign_normal_ps
    description: "CrowdStrike — Normal PowerShell (should NOT fire)"
    malicious: false
    event:
      p_log_type: Crowdstrike.FDREvent
      event_simpleName: ProcessRollup2
      FileName: powershell.exe
      CommandLine: "powershell.exe -NonInteractive Get-Process"
      UserName: BEAZLEY\svc_monitor
      ComputerName: BWKSTN-042

  - id: b64_s1_benign_cmd
    description: "SentinelOne — Normal cmd.exe execution (should NOT fire)"
    malicious: false
    event:
      p_log_type: SentinelOne.DeepVisibilityV2
      "src.process.name": cmd.exe
      "src.process.cmdline": "cmd.exe /c dir C:\\Users"
      "src.process.user": BEAZLEY\helpdesk
      "endpoint.name": BWKSTN-012

  - id: b64_def_benign_script
    description: "Defender XDR — PowerShell scheduled task (should NOT fire)"
    malicious: false
    event:
      p_log_type: MicrosoftDefenderXDR.AdvancedHunting
