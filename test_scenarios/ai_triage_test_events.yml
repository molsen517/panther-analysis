  # ─────────────────────────────────────────────────────────────
  #  STAGE 2 — Entra ID (2 events)
  #  Fires: Beazley.EntraID.BulkMFAReset.AdminRoleAdded
  #  Shared indicator: jsmith@corp.beazley.com + 185.220.101.47
  # ─────────────────────────────────────────────────────────────

  - description: "MFA reset on 2 accounts — attacker using stolen creds"
    malicious: true
    scenario: killchain_stage_2
    expected_detection: Beazley.EntraID.BulkMFAReset.AdminRoleAdded
    event:
      p_log_type: Azure.Audit
      operationName: Update user
      category: AuditLogs
      Level: Informational
      callerIpAddress: 185.220.101.47
      correlationId: entra-ai-triage-001
      properties:
        activityDisplayName: Update user
        result: success
        category: UserManagement
        initiatedBy:
          user:
            id: aad-user-001
            displayName: James Smith
            userPrincipalName: jsmith@corp.beazley.com
            ipAddress: 185.220.101.47
        targetResources:
          - id: aad-user-002
            userPrincipalName: alee@corp.beazley.com
            displayName: Alice Lee
            type: User
            modifiedProperties:
              - displayName: StrongAuthenticationMethods
                oldValue: '[{"MethodType":"PhoneAppNotification","Default":true}]'
                newValue: "[]"
          - id: aad-user-003
            userPrincipalName: rbrown@corp.beazley.com
            displayName: Robert Brown
            type: User
            modifiedProperties:
              - displayName: StrongAuthenticationMethods
                oldValue: '[{"MethodType":"PhoneAppNotification","Default":true}]'
                newValue: "[]"

  - description: "Backdoor account added to Global Administrator role"
    malicious: true
    scenario: killchain_stage_2
    expected_detection: Beazley.EntraID.BulkMFAReset.AdminRoleAdded
    event:
      p_log_type: Azure.Audit
      operationName: Add member to role
      category: AuditLogs
      Level: Informational
      callerIpAddress: 185.220.101.47
      correlationId: entra-ai-triage-002
      properties:
        activityDisplayName: Add member to role
        result: success
        category: RoleManagement
        initiatedBy:
          user:
            id: aad-user-001
            displayName: James Smith
            userPrincipalName: jsmith@corp.beazley.com
            ipAddress: 185.220.101.47
        targetResources:
          - id: aad-user-backdoor
            userPrincipalName: svc.sync@corp.beazley.com
            displayName: Service Sync Account
            type: User
            modifiedProperties: []
          - id: 62e90394-69f5-4237-9190-012177145e10
            displayName: Global Administrator
            type: Role
            modifiedProperties: []

