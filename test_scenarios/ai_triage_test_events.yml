      src.process.cmdline: "cmd.exe /c powershell -enc UwB0AGEAcgB0AC0AUwBsAGUAZQBwACAALQBzACAAMTA="
      src.process.image.path: "C:\\Windows\\System32\\cmd.exe"
      src.process.image.sha256: b9b73e7a4de72b79a5a8c7f9a1234567890abcdef1234567890abcdef12345678
      src.process.user: "BEAZLEY\\jsmith"
      src.process.pid: 6124
